name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@7dafb3c18ece98ed98a2d9d3db90f20aa9466dcc # main
    with:
      working-directory: dotd
