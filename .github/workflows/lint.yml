name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@02fc72c25755dac3a0c635b1e4d48ea549639eec # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@02fc72c25755dac3a0c635b1e4d48ea549639eec # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@02fc72c25755dac3a0c635b1e4d48ea549639eec # main
    with:
      working-directory: dotd
