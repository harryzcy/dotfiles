name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@46b48a2e77cdbf5ca9d39465705fc755bf6ff08f # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@46b48a2e77cdbf5ca9d39465705fc755bf6ff08f # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@46b48a2e77cdbf5ca9d39465705fc755bf6ff08f # main
    with:
      working-directory: dotd
