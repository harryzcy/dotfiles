name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@3b3649a8fd8b9986a9e6d3c45174d40488155d3d # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@3b3649a8fd8b9986a9e6d3c45174d40488155d3d # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@3b3649a8fd8b9986a9e6d3c45174d40488155d3d # main
    with:
      working-directory: dotd
