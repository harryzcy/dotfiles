name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@5eaf925875721488eed093142fde35b53b8e6865 # main

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        # zsh scripts are skipped since ShellCheck doesn't support zsh
        run: |
          mapfile -t files < <(git ls-files -z | while IFS= read -r -d '' f; do
            if head -n1 "$f" | grep -qE '^#!.*\b(bash|sh)\b'; then echo "$f"; fi
          done)
          shellcheck --version
          shellcheck -x "${files[@]}"

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@5eaf925875721488eed093142fde35b53b8e6865 # main
    with:
      working-directory: dotd
