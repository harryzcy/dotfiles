name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@35957b2f1b0ab01fdbca00af3adbbbbdcb3fa5c2 # main
    with:
      working-directory: dotd
