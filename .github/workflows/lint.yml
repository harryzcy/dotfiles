name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@095a6f493e98d00fdc9d09654699d0522dc2be8d # main
    with:
      working-directory: dotd
