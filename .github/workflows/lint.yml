name: Lint

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  super-linter:
    name: Super Linter
    uses: harryzcy/github-actions/.github/workflows/linter.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main

  shell-lint:
    name: Shell Lint
    uses: harryzcy/github-actions/.github/workflows/shell-lint.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main

  go-lint:
    name: Go Lint
    uses: harryzcy/github-actions/.github/workflows/golangci-lint.yml@cacb6a49ad62a7ef1b2d0338273d542a7bfca0c7 # main
    with:
      working-directory: dotd
